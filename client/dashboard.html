<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee — LeaveFlow</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="sidebar-head"><a class="brand" href="/">LeaveFlow</a><button class="sidebar-close" id="sidebarClose" aria-label="Close menu">×</button></div><button class="nav-item active" data-page="home">Dashboard</button><button class="nav-item" data-page="apply">Apply for leave</button><button class="nav-item" data-page="history">My applications</button><button class="nav-item" data-page="password">Change password</button><button class="nav-item" id="logout">Logout</button></aside><div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<main class="content"><header class="top"><button id="menu" class="mobile-menu">☰</button><div><h1 id="greeting">Welcome</h1><p id="employeeInfo"></p></div></header>
<section id="home" class="page"><div class="cards" id="balances"></div><div class="panel"><h2>Quick action</h2><button class="btn btn-primary" data-go="apply">+ Apply for leave</button></div></section>
<section id="apply" class="page hidden"><div class="panel"><h2>Apply for leave</h2><form id="leaveForm" class="form"><select name="leaveType" required><option value="">Select leave type</option><option value="annual">Annual Leave</option><option value="sick">Sick Leave</option><option value="maternity">Maternity Leave</option><option value="paternity">Paternity Leave</option><option value="compassionate">Compassionate Leave</option><option value="study">Study Leave</option><option value="casual">Casual Leave</option><option value="unpaid">Unpaid Leave</option></select><label>Start date<input name="startDate" type="date" required></label><label>End date<input name="endDate" type="date" required></label><textarea name="reason" placeholder="Reason for leave" required></textarea><button class="btn btn-primary">Submit application</button></form><p id="leaveMsg" class="msg"></p></div></section>
<section id="history" class="page hidden"><div class="panel"><h2>My applications</h2><div class="table-wrap"><table><thead><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody id="myRows"></tbody></table></div></div></section>
<section id="password" class="page hidden"><div class="panel small-panel"><h2>Change password</h2><form id="passwordForm" class="form"><input name="currentPassword" type="password" placeholder="Current password" required><input name="newPassword" type="password" placeholder="New password" required><input name="confirm" type="password" placeholder="Confirm new password" required><button class="btn btn-primary">Change password</button></form><p id="passwordMsg" class="msg"></p></div></section>
</main></div><script src="/js/dashboard.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — LeaveFlow</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="sidebar-head"><a class="brand" href="/">LeaveFlow</a><button class="sidebar-close" id="sidebarClose" aria-label="Close menu">×</button></div><button class="nav-item active" data-page="overview">Dashboard</button><button class="nav-item" data-page="employees">Employees</button><button class="nav-item" data-page="leaves">Applications</button><button class="nav-item" id="logout">Logout</button></aside><div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<main class="content"><header class="top"><button id="menu" class="mobile-menu">☰</button><div><h1 id="pageTitle">Dashboard</h1><p>Manage your organization's leave workflow.</p></div></header>
<section id="overview" class="page"><div class="cards"><div class="card"><small>Employees</small><strong id="sEmployees">0</strong></div><div class="card"><small>Pending</small><strong id="sPending">0</strong></div><div class="card"><small>Approved</small><strong id="sApproved">0</strong></div><div class="card"><small>Rejected</small><strong id="sRejected">0</strong></div></div><div class="panel"><h2>Quick actions</h2><button class="btn btn-primary" data-go="employees">Create employee</button><button class="btn btn-ghost" data-go="leaves">Review applications</button></div></section>
<section id="employees" class="page hidden"><div class="panel"><div class="panel-head"><h2>Employees</h2><button class="btn btn-primary" id="showCreate">+ New employee</button></div><div id="createBox" class="hidden"><form id="employeeForm" class="grid-form"><input name="employeeId" placeholder="Employee ID e.g. EMP-001" required><input name="username" placeholder="Username" required><input name="initialPassword" placeholder="Initial password" required><input name="firstName" placeholder="First name" required><input name="lastName" placeholder="Last name" required><input name="department" placeholder="Department"><input name="position" placeholder="Position"><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone"><input name="dateJoined" type="date"><button class="btn btn-primary">Create account</button></form><p id="employeeMsg" class="msg"></p></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>ID</th><th>Department</th><th>Position</th></tr></thead><tbody id="employeeRows"></tbody></table></div></div></section>
<section id="leaves" class="page hidden"><div class="panel"><h2>Leave applications</h2><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Action</th></tr></thead><tbody id="leaveRows"></tbody></table></div></div></section>
</main></div><script src="/js/admin.js"></script></body></html>
